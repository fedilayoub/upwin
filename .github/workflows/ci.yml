name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gates from the README, one job per app. No job needs a secret: AI calls
# are forced into fake mode, and back/test/network-fetch-guard.ts fails any
# test that reaches a non-localhost host.

jobs:
  api:
    name: back (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back

    # Only here so the database integration tests run instead of skipping.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: upwin
          POSTGRES_PASSWORD: upwin
          POSTGRES_DB: upwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upwin -d upwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://upwin:upwin@localhost:5432/upwin_test
      RUN_DATABASE_INTEGRATION: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web:
    name: front (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.local
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  extension:
    name: extension (compile, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.22.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm build
