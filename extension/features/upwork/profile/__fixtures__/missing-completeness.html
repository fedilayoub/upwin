<!--
  Trimmed from a real captured profile page; every new section anchor is still
  readable, while its optional value is absent. All content is sanitized.
-->
<div class="profile-container position-relative">
  <button data-test="pib-edit-button">
    <span class="sr-only">Edit profile</span>
  </button>

  <div itemscope="itemscope" itemtype="http://schema.org/Person">
    <h2 itemprop="name">Sample Freelancer</h2>
  </div>

  <div>
    <div><h5>Availability badge</h5></div>
    <div><p>Off</p></div>
  </div>

  <div>
    <div>
      <h5 role="presentation">Hours per week</h5>
      <button aria-label="Edit availability"></button>
    </div>
  </div>

  <div>
    <div>
      <div><h5 role="presentation">Avg. response</h5></div>
    </div>
  </div>

  <div>
    <h5 role="presentation">Verifications</h5>
    <div>
      <span><strong>Military veteran</strong></span>
      <button aria-label="Add military veteran"></button>
    </div>
  </div>

  <div>
    <div>
      <h5 role="presentation">Licenses</h5>
      <button aria-label="Add license"></button>
    </div>
  </div>

  <div>
    <h5 role="presentation">Linked accounts</h5>
    <div data-qa="linked-accounts"></div>
  </div>
</div>
