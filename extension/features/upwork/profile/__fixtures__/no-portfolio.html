<!-- Trimmed from a real captured profile page; the portfolio shelf is omitted. -->
<div class="profile-container position-relative">
  <section class="air3-card-section">
    <div class="identity-container">
      <div class="identity-content">
        <h2
          itemprop="name"
          role="presentation"
          class="d-inline vertical-align-middle m-0 d-inline-flex align-items-center rr-mask h2"
        >
          Sample Freelancer
        </h2>
        <span
          class="d-inline-block vertical-align-middle ellipsis"
          itemprop="locality"
        >
          Sample City
        </span>
      </div>
    </div>
    <button
      type="button"
      data-test="pib-edit-button"
      class="air3-btn air3-btn-sm air3-btn-circle vertical-align-middle flex-shrink-0"
    >
      <span class="sr-only">Edit availability badge</span>
    </button>
  </section>
  <section class="air3-card-section">
    <div class="mb-10x">
      <h3 class="mb-0 pt-lg-2x h4">
        Sample Profile Title
        <span class="white-space-nowrap">
          <button
            aria-label="Edit title"
            class="air3-btn air3-btn-secondary air3-btn-circle air3-btn-sm ml-2x"
          ></button>
        </span>
      </h3>
    </div>
    <div class="d-flex justify-space-between">
      <div class="air3-line-clamp-wrapper">
        <div class="air3-line-clamp is-clamped">
          <span class="text-body text-pre-line break">
            Sample overview prose for parser testing.
          </span>
        </div>
      </div>
    </div>
  </section>
  <section class="air3-card-section">
    <div class="skills">
      <div class="skills-header d-flex align-items-center mb-3x">
        <span suit-label="skills" class="d-none section-title">Skills</span>
      </div>
      <ul class="d-flex list-unstyled flex-wrap-wrap mb-0 air3-token-wrap">
        <li>
          <span class="">
            <span
              class="skill-name d-flex align-items-center vertical-align-middle air3-token nowrap gap-0"
            >
              Sample Skill Alpha
            </span>
          </span>
        </li>
      </ul>
    </div>
  </section>
</div>
