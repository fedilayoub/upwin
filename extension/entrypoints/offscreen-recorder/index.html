<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      This document reaches the network only to PUT video parts to R2 presigned URLs. Everything
      else it loads ships with the extension. The lock-down also stops the bundled MediaPipe
      runtime's usage logger (odml.pa.googleapis.com) from reporting anything (camera blur).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' blob: data: https://*.r2.cloudflarestorage.com"
    />
    <title>upwin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
